services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: mihomohub
      POSTGRES_USER: mihomohub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck: {test: [CMD-SHELL, "pg_isready -U mihomohub"], interval: 5s, timeout: 5s, retries: 10}
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://mihomohub:${POSTGRES_PASSWORD}@postgres:5432/mihomohub
      SECRET_KEY: ${SECRET_KEY}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      PUBLIC_URL: ${PUBLIC_URL}
    depends_on:
      postgres: {condition: service_healthy}
  web:
    build: ./frontend
    restart: unless-stopped
    depends_on: [backend]
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web]
volumes:
  postgres_data: {}
  caddy_data: {}
  caddy_config: {}
